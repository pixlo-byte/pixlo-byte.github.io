/* name = label | color/glow = body colors | len,wid,h = body size | cabW,cabH,cabL,cabZ = cabin size and position
   wr,ww = wheel radius and width | spoiler = rear wing | stripe = roof stripe color, 0 = none
   sp = top speed x | ac = acceleration x | cr = collision size */
function buildCar(s){
 var g=new T.Group(),M=function(c,e){return new T.MeshLambertMaterial({color:c,emissive:e||0})};
 var b=new T.Mesh(new T.BoxGeometry(s.wid,s.h,s.len),M(s.color,s.glow));
 b.position.y=s.wr+s.h/2-.1;g.add(b);
 var top=b.position.y+s.h/2;
 var cab=new T.Mesh(new T.BoxGeometry(s.cabW,s.cabH,s.cabL),M(0x0b1a10));cab.position.set(0,top+s.cabH/2,s.cabZ);g.add(cab);
 if(s.stripe){var st=new T.Mesh(new T.BoxGeometry(.35,.03,s.len*.92),new T.MeshBasicMaterial({color:s.stripe}));st.position.set(0,top+.02,0);g.add(st)}
 if(s.spoiler){
  [-1,1].forEach(function(k){var p=new T.Mesh(new T.BoxGeometry(.1,.4,.1),M(0x111111));p.position.set(k*s.wid*.35,top+.2,-s.len/2+.2);g.add(p)});
  var wing=new T.Mesh(new T.BoxGeometry(s.wid*.95,.08,.5),M(s.color,s.glow));wing.position.set(0,top+.42,-s.len/2+.1);g.add(wing);
 }
 var wg=new T.CylinderGeometry(s.wr,s.wr,s.ww,14);wg.rotateZ(Math.PI/2);
 var wm=M(0x111111),ws=[],fr=[],bz=s.len*.33;
 [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(function(w,n){
  var pv=new T.Group();pv.position.set(w[0]*(s.wid/2+.05),s.wr,w[1]*bz);
  var m=new T.Mesh(wg,wm);pv.add(m);g.add(pv);ws.push(m);if(n<2)fr.push(pv);
 });
 [-1,1].forEach(function(k){
  var hl=new T.Mesh(new T.BoxGeometry(.4,.22,.1),new T.MeshBasicMaterial({color:0xffffff}));hl.position.set(k*s.wid*.32,b.position.y+.05,s.len/2+.02);g.add(hl);
  var tl=new T.Mesh(new T.BoxGeometry(.4,.2,.1),new T.MeshBasicMaterial({color:0xff2222}));tl.position.set(k*s.wid*.32,b.position.y+.05,-s.len/2-.02);g.add(tl);
 });
 var sg=new T.CircleGeometry(Math.max(s.len,s.wid)*.6,20);sg.rotateX(-Math.PI/2);
 var sh=new T.Mesh(sg,new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false}));sh.position.y=.04;g.add(sh);

function audio(){

 try{
  AC=new(window.AudioContext||window.webkitAudioContext)();
  eng=AC.createOscillator();var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;

}

 try{var o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}

function step(dt){
 var kx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),ky=(keys.arrowup||keys.w?1:0)-(keys.arrowdown||keys.s?1:0);
 st=kx||inp.x;thr=ky||inp.y;
 if(Math.abs(st)<.12)st=0;if(Math.abs(thr)<.12)thr=0;
 var boost=keys.shift||inp.b,brake=keys[' ']||inp.k;
 var fx=Math.sin(h),fz=Math.cos(h),rx=-Math.cos(h),rz=Math.sin(h);
 var fs0=vx*fx+vz*fz;
 h-=st*2.3*dt*Math.max(-1,Math.min(1,fs0/5));

 vx=fx*fs+rx*lat;vz=fz*fs+rz*lat;
 px+=vx*dt;pz+=vz*dt;
 for(var n=0;n<OB.length;n++){
  var o=OB[n],dx=px-o.x,dz=pz-o.z,rr=o.r+CS.cr,d2=dx*dx+dz*dz;
  if(d2<rr*rr){
   var d=Math.sqrt(d2)||.01,nx=dx/d,nz=dz/d;px=o.x+nx*rr;pz=o.z+nz*rr;
   var vn=vx*nx+vz*nz;if(vn<0){vx-=1.5*vn*nx;vz-=1.5*vn*nz;vx*=.8;vz*=.8}
  }
 }
 var L=HALF-2.5;
 if(px>L){px=L;if(vx>0)vx*=-.4}if(px<-L){px=-L;if(vx<0)vx*=-.4}
 if(pz>L){pz=L;if(vz>0)vz*=-.4}if(pz<-L){pz=-L;if(vz<0)vz*=-.4}
 if(bo)bst=Math.max(0,bst-.35*dt);else bst=Math.min(1,bst+.18*dt);
 flame.visible=!!bo;
 car._lat=lat;car._bo=bo;
}
var mc=$('mini'),mx=mc.getContext('2d'),MS=110;
function mp(x,z){return[(x+HALF)/(2*HALF)*MS,MS-(z+HALF)/(2*HALF)*MS]}
function mini(){
 mx.clearRect(0,0,MS,MS);mx.fillStyle='rgba(0,0,0,.55)';mx.fillRect(0,0,MS,MS);
 Z.forEach(function(zn){var q=mp(zn.x,zn.z);mx.fillStyle='#'+('000000'+zn.c.toString(16)).slice(-6);mx.beginPath();mx.arc(q[0],q[1],4,0,7);mx.fill()});
 mx.fillStyle='#7dff6a';
 gems.forEach(function(gm){if(gm.visible){var q=mp(gm.position.x,gm.position.z);mx.fillRect(q[0]-1,q[1]-1,2,2)}});
 var c=mp(px,pz);mx.save();mx.translate(c[0],c[1]);mx.rotate(h);mx.fillStyle='#fff';mx.beginPath();mx.moveTo(0,-5);mx.lineTo(3.5,4);mx.lineTo(-3.5,4);mx.closePath();mx.fill();mx.restore();
}
function showCard(zn){
 cd.innerHTML='<h3>'+zn.h+'</h3><p>'+zn.p+'</p><div class="cbs">'+zn.b.map(function(b){var ext=/^https?:/.test(b[1]);return '<a href="'+b[1]+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+b[0]+'</a>'}).join('')+'</div>';
 cd.classList.add('on');
}
var frameN=0,last=0,t0=0;
function loop(ts){
 requestAnimationFrame(loop);
 var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;if(!t0)t0=ts;
 step(dt);
 var fx=Math.sin(h),fz=Math.cos(h),lat=car._lat||0,bo=car._bo;
 car.position.set(px,0,pz);car.rotation.y=h;
 body.rotation.z=Math.max(-.08,Math.min(.08,lat*.012));
 body.rotation.x=-thr*.025;
 wheels.forEach(function(w){w.rotation.x+=fs*dt/.48});
 fronts.forEach(function(f){f.rotation.y=-st*.45});
 var tx=px-fx*11,tz=pz-fz*11,k=1-Math.exp(-dt*5);
 camPos.x+=(tx-camPos.x)*k;camPos.y+=(6.4-camPos.y)*k;camPos.z+=(tz-camPos.z)*k;
 cam.position.copy(camPos);cam.lookAt(px+fx*3,1.3,pz+fz*3);
 var tf=bo?70:60;cam.fov+=(tf-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();
 var sec=ts/1000;
 gems.forEach(function(gm){
  if(!gm.visible)return;
  gm.rotation.y=sec*2+gm.userData.ph;gm.position.y=1.1+Math.sin(sec*2.5+gm.userData.ph)*.25;
  var dx=px-gm.position.x,dz=pz-gm.position.z;
  if(dx*dx+dz*dz<3.2){gm.visible=false;gcol++;$('gem').textContent=gcol+' / '+gtot;tone(880,1320,.14,.07);if(gcol==gtot){$('hint').style.opacity=1;$('hint').innerHTML='All gems collected! 🎉';setTimeout(function(){$('hint').style.opacity=0},4000)}}
 });
 var inZ=null;
 Z.forEach(function(zn){
  var s=1+Math.sin(sec*3+zn.x)*.04;zn.ring.scale.set(s,s,s);
  if(Math.hypot(px-zn.x,pz-zn.z)<5.2)inZ=zn;
 });
 if(inZ!==cur){cur=inZ;if(cur)showCard(cur);else cd.classList.remove('on')}
 $('bsb').style.width=(bst*100)+'%';
 if(AC&&eng&&eg){eng.frequency.value=55+Math.min(1,Math.abs(fs)/26)*95;eg.gain.value=muted?0:.02+.025*Math.abs(thr)}
 if((frameN++&1)==0)mini();
 rd.render(sc,cam);
 if(frameN==3){$('load').style.opacity=0;setTimeout(function(){$('load').style.display='none'},700)}
 if(t0&&ts-t0>8000)$('hint').style.opacity=0;
}
requestAnimationFrame(loop);
})();
